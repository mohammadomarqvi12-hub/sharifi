{% extends "base.html" %}{% block title %}راه‌اندازی مدیر{% endblock %}{% block content %}
<section class="page-head"><span class="eyebrow">راه‌اندازی اولیه</span><h1>ساخت حساب مدیر اصلی</h1><p>این صفحه فقط تا زمان ایجاد نخستین مدیر فعال است. ابتدا متغیر محیطی SHARIFI_SETUP_KEY را تنظیم کنید.</p></section>
<div class="form-card narrow"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>کلید راه‌اندازی<input name="setup_key" type="password" required></label><label>نام مدیر<input name="name" required></label><label>ایمیل مدیر<input name="email" type="email" required></label><label>رمز عبور قوی (حداقل ۱۴ حرف)<input name="password" type="password" minlength="14" required></label><button class="btn gold full">ایجاد مدیر اصلی</button></form></div>{% endblock %}
