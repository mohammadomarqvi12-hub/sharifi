{% extends "base.html" %}{% block title %}درخواست خرید یا فروش{% endblock %}{% block content %}
<section class="page-head"><span class="eyebrow">درخواست مشتری</span><h1>درخواست خرید یا فروش اسعار</h1><p>این فرم درخواست را برای بررسی ثبت می‌کند؛ معامله تا تأیید و انجام واقعی تکمیل‌شده نیست.</p></section>
<div class="form-card narrow"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>نوع درخواست<select name="direction"><option value="BUY">خرید ارز توسط مشتری</option><option value="SELL">فروش ارز توسط مشتری</option></select></label>
<label>ارز<select name="currency">{% for c in currencies %}<option value="{{ c.code }}">{{ c.code }} — {{ c.name_dari }}</option>{% endfor %}</select></label>
<label>مبلغ<input type="number" name="amount" min="0.0001" step="0.0001" required></label>
<label>یادداشت (اختیاری)<textarea name="note" maxlength="1000"></textarea></label>
<button class="btn gold full">ثبت درخواست</button></form></div>{% endblock %}
